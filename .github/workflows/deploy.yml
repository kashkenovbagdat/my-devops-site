
name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Старый сайт на Runner
  deploy-old:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Deploy old website
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ /var/www/my-devops/

          test -s /var/www/my-devops/index.html

  # Сборка Docker Image
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: bagdatk/my-devops-site:latest

  # Обновление контейнера на Docker-сервере
  deploy-docker:
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DOCKER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/docker_deploy
          chmod 600 ~/.ssh/docker_deploy
          ssh-keyscan -H 192.168.168.109 >> ~/.ssh/known_hosts

      - name: Deploy Docker container
        run: |
          ssh -i ~/.ssh/docker_deploy \
            user@192.168.168.109 \
            'docker pull bagdatk/my-devops-site:latest &&
             docker rm -f my-devops-site 2>/dev/null || true
             docker run -d \
               --restart unless-stopped \
               --name my-devops-site \
               -p 8080:80 \
               bagdatk/my-devops-site:latest'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/docker_deploy
