
name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Deploy website
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ /var/www/my-devops/

          test -s /var/www/my-devops/index.html
